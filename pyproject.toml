[project]
name = "hydrobr"
version = "0.2.0"
description = "HydroBr - tools for acquiring, processing, and analysing Brazilian hydrometeorological data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "HydroBr Developers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pyarrow>=12.0",
    "requests>=2.31",
    "tqdm>=4.65",
    "typer>=0.9",
    "xarray>=2023.7",
    "diskcache>=5.6",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "plotly>=5.16",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "pysheds>=0.3",
    "richdem>=0.3",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "pre-commit>=3.6",
    "ruff>=0.3",
    "black>=24.1",
    "mypy>=1.8",
    "jupytext>=1.16",
]

[project.urls]
Homepage = "https://github.com/wallissoncarvalho/hydrobr"
Documentation = "https://hydrobr.readthedocs.io"
Source = "https://github.com/wallissoncarvalho/hydrobr"

[project.scripts]
hydrobr = "hydrobr.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydrobr = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "B", "C4", "SIM", "UP", "PL", "N", "S", "RUF", "ERA", "PD"]
ignore = ["E203", "E501"]
exclude = ["docs/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.typer]
pretty_exceptions_enable = true
